services:
  fan-bridge:
    build: .
    image: fan-bridge:latest
    container_name: fan-bridge
    restart: unless-stopped

    # Unhealthy when the fan loop has not polled for 30 s (stuck or crashed).
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,time,urllib.request as u; s=json.load(u.urlopen('http://127.0.0.1:5000/api/state',timeout=5))['state']; exit(0 if s.get('last_poll_ts') and time.time()-s['last_poll_ts']<30 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    # GPU sensors are read from /sys/class/drm (read-only is enough).
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video

    # Dashboard: http://<host>:5000
    ports:
      - "5000:5000"

    environment:
      - ILO_HOST=CHANGE_ME              # your iLO IP or hostname (required)
      - ILO_VERIFY_SSL=false            # iLO's self-signed cert; true if you've installed a real one
      - ILO_SECRETS_PATH=/run/secrets/ilo_creds.json
      - SETTINGS_PATH=/data/settings.json
      - HSA_OVERRIDE_GFX_VERSION=9.0.6  # lets rocm-smi (fallback sensor path) enumerate gfx906

    volumes:
      - ./secrets/ilo_creds.json:/run/secrets/ilo_creds.json:ro
      - ./data:/data   # settings.json persists here across rebuilds/restarts
      # Optional, needed for perf-on-demand: one writable sysfs
      # device dir per GPU. Use the colon-free /sys/class/drm/cardN/device path
      # (find yours with: ls -l /sys/class/drm/card*/device). perf.py
      # only touches dirs whose PCI id is an MI50/MI60.
      # - type: bind
      #   source: /sys/class/drm/card1/device
      #   target: /gpu/card1
      # - type: bind
      #   source: /sys/class/drm/card2/device
      #   target: /gpu/card2

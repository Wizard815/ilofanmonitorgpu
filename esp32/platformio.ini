; Build + flash:  cd esp32 && pio run -t upload
; Later updates over Wi-Fi:  pio run -t upload --upload-port jbod-fans.local
[platformio]
src_dir = jbod_fans

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0

[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = jbod-fans.local
; upload_flags = --auth=<OTA_PASSWORD>
